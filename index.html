          ctx.stroke();
        }
      }

      for (let i = vapor.length - 1; i > 0; i--) {
        const current = vapor[i];
        const previous = vapor[i - 1];
        const a1 = projectPoint(current.left);
        const a2 = projectPoint(previous.left);
        const b1 = projectPoint(current.right);
        const b2 = projectPoint(previous.right);
        if (!a1 || !a2 || !b1 || !b2) continue;
        const alpha = clamp(1 - current.age / 3.2, 0, 1) * (1 - i / vapor.length) * 0.72;
        ctx.strokeStyle = `rgba(235, 229, 211, ${alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(a1.x, a1.y);
        ctx.lineTo(a2.x, a2.y);
        ctx.moveTo(b1.x, b1.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.stroke();
      }
    }

    function drawParticles(ctx) {
      for (const puff of smokePuffs) {
        const p = projectPoint({ x: puff.x, y: puff.y, z: puff.z });
        if (!p) continue;
        const life = 1 - puff.age / puff.life;
        const size = clamp(puff.size * p.scale * 2.5, 1, 12);
        ctx.fillStyle = `rgba(55, 48, 59, ${clamp(life * 0.48, 0, 0.45)})`;
        ctx.fillRect(Math.round(p.x - size / 2), Math.round(p.y - size / 2), Math.ceil(size), Math.ceil(size));
      }

      for (const missile of missiles) {
        const p = projectPoint(missile.position);
        if (!p) continue;
        const size = clamp(p.scale * 1.8, 1, 4);
        ctx.fillStyle = "#fff4c5";
        ctx.fillRect(p.x - size / 2, p.y - size / 2, size + 1, size + 1);
        ctx.fillStyle = "rgba(255, 109, 42, 0.75)";
        ctx.fillRect(p.x - size * 1.2, p.y - size * 1.2, size * 2.4, size * 2.4);
      }

      for (const particle of spray) {
        const p = projectPoint(particle);
        if (!p) continue;
        const a = clamp(1 - particle.age / particle.life, 0, 1);
        ctx.fillStyle = `rgba(205, 237, 228, ${a * 0.75})`;
        ctx.fillRect(p.x, p.y, 1, 1);
      }

      for (const explosion of explosions) {
        const center = projectPoint({ x: explosion.x, y: explosion.y + 2, z: explosion.z });
        if (!center) continue;
        if (params.has("impact")) {
          document.body.dataset.impactProjection = `${Math.round(center.x)},${Math.round(center.y)},${center.scale.toFixed(2)}`;
        }
        const age = explosion.age;
        if (age < 0.38) {
          const fireScale = clamp(center.scale * 12, 0.7, 2.5);
          const radius = (8 + age * 80) * fireScale;
          ctx.fillStyle = `rgba(255, 78, 27, ${clamp(0.76 - age * 1.45, 0, 0.76)})`;
          ctx.beginPath();
          ctx.arc(center.x, center.y, radius * 1.25, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "rgba(255, 174, 58, 0.92)";
          ctx.beginPath();
          ctx.arc(center.x, center.y - radius * 0.12, radius * 0.76, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "rgba(255, 249, 206, 0.98)";
          ctx.beginPath();
          ctx.arc(center.x, center.y - radius * 0.05, radius * 0.34, 0, TAU);
          ctx.fill();
        }
        if (age < 1.15) {
          const ring = (age / 1.15) * 34 * clamp(center.scale * 14, 0.3, 1.7);
          ctx.strokeStyle = `rgba(255, 201, 125, ${0.8 * (1 - age / 1.15)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(center.x, center.y, ring * 1.4, ring * 0.72, -0.12, 0, TAU);
          ctx.stroke();
        }
        for (const particle of explosion.particles) {
          if (particle.age > particle.life) continue;
          const p = projectPoint(particle);
          if (!p) continue;
          const life = 1 - particle.age / particle.life;
          const size = clamp(particle.size * p.scale * 2.6, 2, 9);
          if (particle.type === "water") {
            ctx.fillStyle = `rgba(184, 228, 225, ${life * 0.8})`;
          } else if (life > 0.5) {
            ctx.fillStyle = `rgba(255, ${Math.round(140 + life * 95)}, 58, ${life})`;
          } else {
            ctx.fillStyle = `rgba(61, 51, 57, ${life * 0.85})`;
          }
          ctx.fillRect(p.x - size / 2, p.y - size / 2, Math.ceil(size), Math.ceil(size));
        }
      }
    }

    function drawHudFrame(ctx) {
      const w = state.renderWidth;
      const h = state.renderHeight;
      const amber = "#ffc36d";
      const pale = "#efe8d7";
      const dim = "rgba(235, 225, 205, 0.54)";
      const red = "#ff896f";
      const speedKts = Math.round(260 + plane.airspeed * 2.18);
      const altitude = Math.round(plane.y * 12.5);
      const radarAltitude = Math.round((plane.y - Math.max(SEA_LEVEL, terrainElevation(plane.x, plane.z))) * 12.5);
      const headingDeg = mod(plane.heading * 180 / Math.PI, 360);
      const pitchDeg = plane.pitch * 180 / Math.PI;
      const rollDeg = (plane.roll + plane.maneuverRoll) * 180 / Math.PI;

      ctx.save();
      ctx.imageSmoothingEnabled = false;

      // Title card.
      if (state.titleAge < 5.4) {
        const alpha = clamp(Math.min(state.titleAge / 0.7, (5.4 - state.titleAge) / 1.1), 0, 1);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "rgba(28, 23, 36, 0.70)";
        const cardW = Math.min(226, w - 28);
        ctx.fillRect(14, Math.round(h * 0.16), cardW, 55);
        ctx.fillStyle = amber;
        ctx.fillRect(14, Math.round(h * 0.16), 3, 55);
        text(ctx, "PATROL", 25, Math.round(h * 0.16) + 9, {
          font: "Press Start 2P",
          size: w < 500 ? 13 : 16,
          color: "#fff1d1",
          shadow: true
        });
        text(ctx, "AUTUMN LAKE / FLIGHT 04", 26, Math.round(h * 0.16) + 31, {
          size: 7,
          color: amber
        });
        text(ctx, "THE LAST LIGHT IS YOURS.", 26, Math.round(h * 0.16) + 43, {
          size: 6,
          color: dim
        });
        ctx.globalAlpha = 1;
      }

      if (state.mode < 2) {
        // Minimal flight HUD.
        ctx.strokeStyle = "rgba(247, 227, 192, 0.52)";
        ctx.lineWidth = 1;
        ctx.strokeRect(9.5, 9.5, w - 19, h - 19);
        text(ctx, "PATROL // AUTUMN LAKE", 15, 15, { size: 7, color: pale, shadow: true });
        text(ctx, state.modeName[state.mode] + " CAM", w - 62, 15, { size: 7, color: amber, shadow: true });
        text(ctx, "SPD", 15, h - 38, { size: 6, color: dim });
        text(ctx, String(speedKts).padStart(3, "0"), 15, h - 30, { size: 10, color: pale });
        text(ctx, "ALT", 15, h - 20, { size: 6, color: dim });
        text(ctx, String(altitude).padStart(5, "0"), 31, h - 22, { size: 7, color: pale });

        text(ctx, `MSL ${missileAmmo}`, w - 57, h - 37, { size: 7, color: missileAmmo ? pale : red });
        text(ctx, `${plane.airspeed >= 180 ? "A/B" : "CRUISE"}`, w - 57, h - 26, {
          size: 6,
          color: plane.airspeed >= 180 ? amber : dim
        });

        if (state.pointer.inside) {
          const cx = (state.pointer.x * 0.5 + 0.5) * w;
          const cy = (state.pointer.y * 0.5 + 0.5) * h;
          ctx.strokeStyle = "rgba(251, 232, 196, 0.66)";
          ctx.beginPath();
          ctx.arc(cx, cy, 4, 0, TAU);
          ctx.moveTo(cx - 9, cy);
          ctx.lineTo(cx - 5, cy);
          ctx.moveTo(cx + 5, cy);
          ctx.lineTo(cx + 9, cy);
          ctx.moveTo(cx, cy - 9);
          ctx.lineTo(cx, cy - 5);
          ctx.moveTo(cx, cy + 5);
          ctx.lineTo(cx, cy + 9);
          ctx.stroke();
        }
      } else {
        drawPitchLadder(ctx, pitchDeg, rollDeg, amber);
        drawCockpitDashboard(ctx);

        // HUD tapes and readouts.
        const topY = 13;
        text(ctx, String(Math.round(headingDeg)).padStart(3, "0") + "°", w / 2, topY, {
          align: "center",
          size: 8,
          color: pale,
          shadow: true
        });
        ctx.strokeStyle = "rgba(255, 198, 109, 0.74)";
        ctx.lineWidth = 1;
        ctx.strokeRect(w / 2 - 31.5, 10.5, 63, 12);
        pixelLine(ctx, w / 2 - 16, 6, w / 2, 9, amber);
        pixelLine(ctx, w / 2 + 16, 6, w / 2, 9, amber);

        text(ctx, "IAS", w * 0.34, h * 0.45, { size: 6, color: dim, align: "center" });
        text(ctx, String(speedKts).padStart(3, "0"), w * 0.34, h * 0.48, {
          size: 10,
          color: pale,
          align: "center",
          shadow: true
        });
        text(ctx, "ALT", w * 0.66, h * 0.45, { size: 6, color: dim, align: "center" });
        text(ctx, String(altitude).padStart(5, "0"), w * 0.66, h * 0.48, {
          size: 10,
          color: pale,
          align: "center",
          shadow: true
        });

        text(ctx, `G ${plane.safeG.toFixed(1)}`, w * 0.18, h * 0.55, { size: 7, color: pale });
        text(ctx, `R ${radarAltitude || 0}`, w * 0.18, h * 0.55 + 11, { size: 7, color: dim });
        text(ctx, `FOX ${missileAmmo}`, w - 15, h * 0.55, { size: 7, color: missileAmmo ? amber : red, align: "right" });
        text(ctx, reloadTimer > 0 ? `RLD ${Math.max(0, reloadTimer).toFixed(1)}` : "ARMED", w - 15, h * 0.55 + 11, {
          size: 6,
          color: reloadTimer > 0 ? red : amber,
          align: "right"
        });

        if (state.afterburnerVisual > 0.35) {
          text(ctx, "AFTERBURNER", w / 2, h * 0.39, {
            size: 7,
            color: amber,
            align: "center",
            shadow: true
          });
        }
        const warning = state.warnings[0];
        if (warning) {
          const blink = Math.sin(warning.age * 18) > -0.2;
          if (blink) {
            text(ctx, warning.text, w / 2, h * 0.34, {
              size: 8,
              color: red,
              align: "center",
              shadow: true
            });
          }
        }
      }

      // Mode label appears after camera cycling.
      if (state.modeFlash > 0) {
        ctx.globalAlpha = clamp(state.modeFlash / 0.35, 0, 1);
        ctx.fillStyle = "rgba(25, 20, 33, 0.72)";
        ctx.fillRect(w / 2 - 42, 27, 84, 16);
        text(ctx, `${state.modeName[state.mode]} VIEW`, w / 2, 32, {
          size: 7,
          color: amber,
          align: "center"
        });
        ctx.globalAlpha = 1;
      }

      // Quiet controls strip.
      const stripH = state.mode === 2 ? 15 : 17;
      ctx.fillStyle = "rgba(19, 16, 27, 0.74)";
      ctx.fillRect(0, h - stripH, w, stripH);
      const hint = w > 720
        ? "MOUSE STEER  /  HOLD LMB BURN  /  CLICK ROLL  /  R/F MISSILE  /  SPACE CAMERA  /  M SOUND"
        : "MOUSE STEER / HOLD LMB BURN / R/F MISSILE / SPACE VIEW";
      text(ctx, hint, 10, h - stripH + 5, {
        size: w > 720 ? 6 : 5,
        color: "rgba(237, 228, 209, 0.66)"
      });
      ctx.restore();
    }

    function drawPitchLadder(ctx, pitchDeg, rollDeg, color) {
      const w = state.renderWidth;
      const h = state.renderHeight;
      const centerX = w / 2;
      const centerY = state.mode === 2 ? h * 0.5 : h * 0.42;
      const pixelsPerDegree = h / (camera.fov * 180 / Math.PI) * 0.82;
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(-rollDeg * Math.PI / 180);
      for (let angle = -30; angle <= 30; angle += 5) {
        const y = (pitchDeg - angle) * pixelsPerDegree;
        if (Math.abs(y) > h * 0.26) continue;
        const half = angle === 0 ? 34 : (22 - Math.abs(angle) * 0.15);
        ctx.strokeStyle = angle === 0 ? "rgba(255, 198, 109, 0.86)" : "rgba(255, 221, 169, 0.54)";
        ctx.lineWidth = 1;
        ctx.setLineDash(angle < 0 ? [4, 3] : []);
        ctx.beginPath();
        ctx.moveTo(-half, y);
        ctx.lineTo(-8, y);
        ctx.moveTo(8, y);
        ctx.lineTo(half, y);
        ctx.stroke();
        ctx.setLineDash([]);
        if (angle !== 0) {
          text(ctx, String(Math.abs(angle)), -half - 9, y, {
            size: 5,
            color: "rgba(255, 224, 171, 0.58)",
            baseline: "middle"
          });
          text(ctx, String(Math.abs(angle)), half + 3, y, {
            size: 5,
            color: "rgba(255, 224, 171, 0.58)",
            baseline: "middle"
          });
        }
      }
      ctx.setLineDash([]);
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.moveTo(-22, 0);
      ctx.lineTo(-8, 0);
      ctx.lineTo(0, 6);
      ctx.lineTo(8, 0);
      ctx.lineTo(22, 0);
      ctx.stroke();
      ctx.restore();
    }

    function drawGauge(ctx, x, y, size, label, value, unit, color = "#ffc36d") {
      ctx.fillStyle = "rgba(10, 9, 15, 0.92)";
      ctx.fillRect(x, y, size, size);
      ctx.strokeStyle = "rgba(236, 222, 199, 0.44)";
      ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
      text(ctx, label, x + 3, y + 3, { size: 4, color: "rgba(219, 208, 191, 0.63)" });
      text(ctx, value, x + 3, y + size - 9, { size: 7, color });
      text(ctx, unit, x + size - 3, y + size - 8, { size: 4, color: "rgba(219, 208, 191, 0.58)", align: "right" });
    }

    function drawCockpitDashboard(ctx) {
      const w = state.renderWidth;
      const h = state.renderHeight;
      if (w < 360) {
        drawCompactCockpit(ctx);
        return;
      }
      const panelY = Math.round(h * 0.67);
      const panelH = h - panelY;
      const speedKts = Math.round(260 + plane.airspeed * 2.18);
      const altitude = Math.round(plane.y * 12.5);
      const radarAlt = Math.max(0, Math.round((plane.y - Math.max(SEA_LEVEL, terrainElevation(plane.x, plane.z))) * 12.5));
      const heading = mod(plane.heading * 180 / Math.PI, 360);
      const pitch = plane.pitch * 180 / Math.PI;
      const roll = (plane.roll + plane.maneuverRoll) * 180 / Math.PI;
      const verticalSpeed = Math.round(Math.sin(plane.pitch) * plane.airspeed * 7.2);

      ctx.fillStyle = "#17141e";
      ctx.beginPath();
      ctx.moveTo(0, panelY + 7);
      ctx.lineTo(Math.round(w * 0.09), panelY);
      ctx.lineTo(Math.round(w * 0.91), panelY);
      ctx.lineTo(w, panelY + 7);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#4c4252";
      ctx.fillRect(Math.round(w * 0.09), panelY - 1, Math.round(w * 0.82), 2);
      ctx.fillStyle = "#0d0b11";
      ctx.fillRect(0, panelY + 3, w, 2);

      const margin = Math.max(6, Math.round(w * 0.018));
      const gaugeSize = Math.min(46, Math.max(31, Math.round(panelH * 0.48)));
      const gap = Math.max(4, Math.round(w * 0.007));
      const startX = margin;
      const top = panelY + 7;

      // Airspeed and true altitude.
      drawGauge(ctx, startX, top, gaugeSize, "IAS", String(speedKts).padStart(3, "0"), "KT");
      drawGauge(ctx, startX + gaugeSize + gap, top, gaugeSize, "ALT", String(altitude).padStart(5, "0"), "FT", "#e8e0d0");

      // Artificial horizon.
      const adiX = Math.round(w * 0.37);
      const adiY = top;
      const adiW = gaugeSize + 14;
      ctx.save();
      ctx.beginPath();
      ctx.rect(adiX, adiY, adiW, gaugeSize);
      ctx.clip();
      ctx.fillStyle = "#31505a";
      ctx.fillRect(adiX, adiY, adiW, gaugeSize);
      ctx.fillStyle = "#6c4a2e";
      ctx.fillRect(adiX, adiY + gaugeSize * 0.5, adiW, gaugeSize);
      ctx.save();
      ctx.translate(adiX + adiW / 2, adiY + gaugeSize / 2 + pitch * 0.76);
      ctx.rotate(-roll * Math.PI / 180);
      pixelLine(ctx, -adiW * 0.7, 0, -9, 0, "#f0dfb9");
      pixelLine(ctx, 9, 0, adiW * 0.7, 0, "#f0dfb9");
      pixelLine(ctx, -7, 0, 0, 4, "#f0dfb9");
      pixelLine(ctx, 7, 0, 0, 4, "#f0dfb9");
      ctx.restore();
      ctx.strokeStyle = "#111019";
      ctx.lineWidth = 2;
      ctx.strokeRect(adiX + 0.5, adiY + 0.5, adiW - 1, gaugeSize - 1);
      ctx.restore();
      text(ctx, "ADI", adiX + 3, adiY + 3, { size: 4, color: "#d7cfc0" });
      text(ctx, `${pitch >= 0 ? "+" : ""}${pitch.toFixed(0)}`, adiX + 3, adiY + gaugeSize - 8, { size: 5, color: "#e9dfca" });

      // Turn and slip.
      const turnW = 31;
      const turnX = adiX + adiW + gap;
      ctx.fillStyle = "#0d0c12";
      ctx.fillRect(turnX, top, turnW, gaugeSize);
      ctx.strokeStyle = "#665c6b";
      ctx.strokeRect(turnX + 0.5, top + 0.5, turnW - 1, gaugeSize - 1);
      text(ctx, "TURN", turnX + 3, top + 3, { size: 4, color: "#aaa0aa" });
      pixelLine(ctx, turnX + turnW / 2, top + 12, turnX + turnW / 2, top + gaugeSize - 10, "#675d69");
      pixelLine(ctx, turnX + 8, top + 18, turnX + turnW - 8, top + 18, "#675d69");
      ctx.save();
      ctx.translate(turnX + turnW / 2 + clamp(plane.turnSmooth * 13, -11, 11), top + 21);
      ctx.rotate(clamp(plane.turnSmooth * 0.55, -0.55, 0.55));
      ctx.fillStyle = "#edcf91";
      ctx.fillRect(-1, -7, 2, 14);
      ctx.fillRect(-5, -1, 10, 2);
      ctx.restore();
      text(ctx, `${plane.turnSmooth > 0.02 ? "R" : plane.turnSmooth < -0.02 ? "L" : "S"}`, turnX + 3, top + gaugeSize - 8, { size: 5, color: "#d8ceba" });

      // Heading compass.
      const compX = turnX + turnW + gap;
      ctx.fillStyle = "#0d0c12";
      ctx.fillRect(compX, top, turnW + 3, gaugeSize);
      ctx.strokeStyle = "#665c6b";
      ctx.strokeRect(compX + 0.5, top + 0.5, turnW + 2, gaugeSize - 1);
      text(ctx, "HDG", compX + 3, top + 3, { size: 4, color: "#aaa0aa" });
      const ticks = [-20, -10, 0, 10, 20];
      for (const tick of ticks) {
        const tx = compX + (turnW + 3) / 2 + tick * 0.72;
        const major = tick === 0;
        pixelLine(ctx, tx, top + 13, tx, top + 13 + (major ? 8 : 4), major ? "#ffc36d" : "#766a76");
      }
      text(ctx, String(Math.round(heading)).padStart(3, "0") + "°", compX + (turnW + 3) / 2, top + 26, {
        size: 6,
        color: "#e8dcc7",
        align: "center"
      });

      // Radar. Amber sweep and real height-map land returns.
      const radarSize = gaugeSize + 8;
      const radarX = Math.round(w * 0.63);
      const radarY = top;
      ctx.fillStyle = "#080b0b";
      ctx.fillRect(radarX, radarY, radarSize, radarSize);
      ctx.strokeStyle = "#735d3d";
      ctx.strokeRect(radarX + 0.5, radarY + 0.5, radarSize - 1, radarSize - 1);
      ctx.save();
      ctx.beginPath();
      ctx.arc(radarX + radarSize / 2, radarY + radarSize / 2, radarSize * 0.42, 0, TAU);
      ctx.clip();
      for (let rz = -4; rz <= 4; rz++) {
        for (let rx = -4; rx <= 4; rx++) {
          if (rx * rx + rz * rz > 16) continue;
          const angle = plane.heading;
          const wx = plane.x + (Math.cos(angle) * rx - Math.sin(angle) * rz) * 68;
          const wz = plane.z + (Math.sin(angle) * rx + Math.cos(angle) * rz) * 68;
          if (terrainElevation(wx, wz) > SEA_LEVEL + 2) {
            ctx.fillStyle = Math.abs(rx) + Math.abs(rz) < 4 ? "#b07b41" : "#62513b";
            ctx.fillRect(radarX + radarSize / 2 + rx * 2.4, radarY + radarSize / 2 + rz * 2.4, 2, 2);
          }
        }
      }
      const sweep = state.time * 1.9 - Math.PI / 2;
      ctx.fillStyle = "rgba(255, 185, 91, 0.15)";
      ctx.beginPath();
      ctx.moveTo(radarX + radarSize / 2, radarY + radarSize / 2);
      ctx.arc(radarX + radarSize / 2, radarY + radarSize / 2, radarSize * 0.55, sweep - 0.35, sweep);
      ctx.closePath();
      ctx.fill();
      pixelLine(ctx, radarX + radarSize / 2, radarY + radarSize / 2, radarX + radarSize / 2 + Math.cos(sweep) * radarSize * 0.5, radarY + radarSize / 2 + Math.sin(sweep) * radarSize * 0.5, "#ffc36d");
      ctx.restore();
      text(ctx, "GND", radarX + 3, radarY + 3, { size: 4, color: "#d0a365" });
      text(ctx, `${radarAlt}`, radarX + radarSize - 3, radarY + radarSize - 8, { size: 5, color: "#ffc36d", align: "right" });

      // Engine gauges and throttle.
      const engX = radarX + radarSize + gap;
      drawGauge(ctx, engX, top, Math.min(38, w - engX - margin - 17), "ENG", String(Math.round(63 + state.afterburnerVisual * 37)), "%", "#e8c788");
      const throttleX = w - margin - 10;
      ctx.fillStyle = "#08070c";
      ctx.fillRect(throttleX, top, 8, gaugeSize);
      ctx.strokeStyle = "#64596a";
      ctx.strokeRect(throttleX + 0.5, top + 0.5, 7, gaugeSize - 1);
      const throttleY = top + gaugeSize - 10 - state.afterburnerVisual * (gaugeSize - 20);
      ctx.fillStyle = state.afterburnerVisual > 0.35 ? "#ffad5d" : "#caad79";
      ctx.fillRect(throttleX - 3, throttleY, 14, 5);
      text(ctx, "THR", throttleX - 1, top - 6, { size: 4, color: "#c8b9a0" });

      // Bottom placards: remaining instruments, VSI, clock, warnings.
      const bottomY = panelY + gaugeSize + 11;
      text(ctx, "V/S", margin, bottomY, { size: 4, color: "#7e7481" });
      text(ctx, `${verticalSpeed >= 0 ? "+" : ""}${verticalSpeed}`, margin + 15, bottomY, {
        size: 5,
        color: "#ddcfb8"
      });
      text(ctx, "RDR", margin + 54, bottomY, { size: 4, color: "#7e7481" });
      text(ctx, `${radarAlt} FT`, margin + 70, bottomY, { size: 5, color: "#ddcfb8" });

      const now = new Date();
      const clock = now.toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
      text(ctx, "LOCAL", w / 2 - 12, bottomY, { size: 4, color: "#7e7481", align: "center" });
      text(ctx, clock, w / 2 + 14, bottomY, { size: 5, color: "#e4d8c3" });

      const warnColor = radarAlt < 900 ? "#ff8066" : radarAlt < 1600 ? "#ffc36d" : "#7d8e77";
      text(ctx, "PULL UP", w - margin - 51, bottomY, { size: 4, color: warnColor, align: "right" });
      text(ctx, "MISSILE", w - margin - 51, bottomY + 7, { size: 4, color: missileAmmo ? "#936e51" : "#ff8066", align: "right" });
      text(ctx, "BURN", w - margin - 51, bottomY + 14, { size: 4, color: state.afterburnerVisual > 0.35 ? "#ffc36d" : "#6b605e", align: "right" });

      // Simple frame screws and edge wear.
      ctx.fillStyle = "#756572";
      for (const sx of [margin, Math.round(w / 2), w - margin]) {
        ctx.fillRect(sx, panelY + 4, 1, 1);
      }
    }

    function drawCompactCockpit(ctx) {
      const w = state.renderWidth;
      const h = state.renderHeight;
      const panelY = Math.round(h * 0.7);
      const margin = 7;
      const gap = 5;
      const cellW = Math.floor((w - margin * 2 - gap * 2) / 3);
      const cellH = 31;
      const top = panelY + 14;
      const speedKts = Math.round(260 + plane.airspeed * 2.18);
      const altitude = Math.round(plane.y * 12.5);
      const radarAlt = Math.max(0, Math.round((plane.y - Math.max(SEA_LEVEL, terrainElevation(plane.x, plane.z))) * 12.5));
      const heading = mod(plane.heading * 180 / Math.PI, 360);
      const pitch = plane.pitch * 180 / Math.PI;
      const roll = (plane.roll + plane.maneuverRoll) * 180 / Math.PI;
      const verticalSpeed = Math.round(Math.sin(plane.pitch) * plane.airspeed * 7.2);

      ctx.fillStyle = "#17141e";
      ctx.beginPath();
      ctx.moveTo(0, panelY + 7);
      ctx.lineTo(13, panelY);
      ctx.lineTo(w - 13, panelY);
      ctx.lineTo(w, panelY + 7);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#4c4252";
      ctx.fillRect(13, panelY - 1, w - 26, 2);

      drawGauge(ctx, margin, top, cellW, "IAS", String(speedKts).padStart(3, "0"), "KT");
      drawGauge(ctx, margin + cellW + gap, top, cellW, "ALT", String(altitude).padStart(5, "0"), "FT", "#e8e0d0");
      drawGauge(ctx, margin + (cellW + gap) * 2, top, cellW, "RDR", String(radarAlt).padStart(4, "0"), "FT", "#d59b5d");

      const secondY = top + cellH + 6;
      drawGauge(ctx, margin, secondY, cellW, "HDG", String(Math.round(heading)).padStart(3, "0") + "°", "", "#e8e0d0");

      const adiX = margin + cellW + gap;
      ctx.fillStyle = "#0a0a10";
      ctx.fillRect(adiX, secondY, cellW, cellH);
      ctx.strokeStyle = "#665c6b";
      ctx.strokeRect(adiX + 0.5, secondY + 0.5, cellW - 1, cellH - 1);
      text(ctx, "ADI", adiX + 3, secondY + 3, { size: 4, color: "#aaa0aa" });
      ctx.save();
      ctx.beginPath();
      ctx.rect(adiX + 2, secondY + 9, cellW - 4, cellH - 12);
      ctx.clip();
      ctx.fillStyle = "#31505a";
      ctx.fillRect(adiX + 2, secondY + 9, cellW - 4, cellH / 2);
      ctx.fillStyle = "#6c4a2e";
      ctx.fillRect(adiX + 2, secondY + 9 + cellH / 2, cellW - 4, cellH / 2);
      ctx.save();
      ctx.translate(adiX + cellW / 2, secondY + 16 + pitch * 0.3);
      ctx.rotate(-roll * Math.PI / 180);
      pixelLine(ctx, -cellW * 0.35, 0, cellW * 0.35, 0, "#f0dfb9");
      ctx.restore();
      ctx.restore();

      const engX = margin + (cellW + gap) * 2;
      drawGauge(ctx, engX, secondY, cellW, "ENG", String(Math.round(63 + state.afterburnerVisual * 37)), "%", "#d8b777");

      const now = new Date();
      const clock = now.toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit" });
      const bottomY = secondY + cellH + 8;
      text(ctx, `V/S ${verticalSpeed >= 0 ? "+" : ""}${verticalSpeed}`, margin, bottomY, { size: 5, color: "#c9bda8" });
      text(ctx, plane.turnSmooth > 0.02 ? "TURN R" : plane.turnSmooth < -0.02 ? "TURN L" : "WINGS LEVEL", w / 2, bottomY, {
        size: 5,
        color: "#9e929e",
        align: "center"
      });
      text(ctx, clock, w - margin, bottomY, { size: 5, color: "#d8ccb7", align: "right" });
    }

    function frame(now) {
      requestAnimationFrame(frame);
      const rawDt = Math.min(0.05, (now - state.lastTime) / 1000);
      const ms = now - state.lastTime;
      state.lastTime = now;
      if (!state.started) return;
      state.frame++;
      update(rawDt);
      renderWorld();
      hud.clearRect(0, 0, state.renderWidth, state.renderHeight);
      hud.imageSmoothingEnabled = false;
      drawWorldEffects(hud);
      drawParticles(hud);
      drawHudFrame(hud);
      updateAdaptiveResolution(ms);
      document.body.dataset.state = "running";
      debugState.info = {
        mode: state.modeName[state.mode],
        ammo: missileAmmo,
        missiles: missiles.length,
        impacts: impacts.length,
        x: plane.x,
        y: plane.y,
        z: plane.z,
        heading: plane.heading,
        pitch: plane.pitch,
        renderWidth: state.renderWidth,
        renderHeight: state.renderHeight
      };
      if (state.frame % 45 === 0) {
        document.body.dataset.telemetry = JSON.stringify(debugState.info);
      }
    }

    function applyDebugParams() {
      const view = params.get("view");
      if (view === "chase") state.mode = 1;
      if (view === "cockpit") state.mode = 2;
      if (view === "top") state.mode = 0;
      const requestedMode = state.mode;
      if (params.has("x")) plane.x = Number(params.get("x")) || plane.x;
      if (params.has("z")) plane.z = Number(params.get("z")) || plane.z;
      if (params.has("y")) plane.y = Number(params.get("y")) || plane.y;
      if (params.has("heading")) plane.heading = Number(params.get("heading")) || plane.heading;
      if (params.has("pitch")) plane.pitch = Number(params.get("pitch")) || 0;
      if (params.has("burn")) state.touch.burn = true;
      plane.y = Math.max(plane.y, terrainElevation(plane.x, plane.z) + 145);
      const target = targetCamera();
      camera.position = { ...target.position };
      camera.forward = { ...target.forward };
      camera.right = { ...target.right };
      camera.up = { ...target.up };
      camera.fov = target.fov;
      state.mode = requestedMode;
      if (params.has("title")) state.titleAge = 0.1;
      else state.titleAge = 8;
      const delay = Number(params.get("autofire") || 0);
      if (delay > 0) {
        setTimeout(() => {
          if (state.mode !== 2) fireMissile();
          else {
            state.mode = 1;
            fireMissile();
          }
        }, delay);
      }
      if (params.has("impact")) {
        const basis = aircraftBasis(plane.heading, plane.pitch, plane.roll);
        const target = add3(
          { x: plane.x, y: plane.y, z: plane.z },
          mul3(basis.forward, 900)
        );
        target.y = Math.max(SEA_LEVEL, terrainElevation(target.x, target.z));
        spawnImpact(target);
        if (params.has("freeze")) state.paused = true;
      }
      if (params.has("roll")) setTimeout(triggerBarrelRoll, Number(params.get("roll")));
      if (params.has("soak")) {
        const interval = setInterval(() => {
          const t = state.time;
          state.pointer.active = true;
          state.pointer.inside = true;
          state.pointer.x = Math.sin(t * 0.67) * 0.82;
          state.pointer.y = Math.sin(t * 0.41 + 1.2) * 0.38;
          state.touch.burn = Math.floor(t / 4) % 3 === 0;
          if (Math.floor(t * 2) % 25 === 0) triggerBarrelRoll();
          if (Math.floor(t * 3) % 17 === 0) fireMissile();
          if (Math.floor(t) % 19 === 0 && state.mode !== 2) cycleCamera();
        }, 90);
        setTimeout(() => clearInterval(interval), 180000);
      }
      if (params.has("survey")) {
        const columns = 28;
        const rows = 20;
        const candidates = [];
        let waterSamples = 0;
        let allSamples = 0;
        let heightTotal = 0;
        for (let gy = 0; gy < rows; gy++) {
          for (let gx = 0; gx < columns; gx++) {
            const x = -WORLD_SIZE * 0.5 + (gx + 0.5) * WORLD_SIZE / columns;
            const z = -WORLD_SIZE * 0.5 + (gy + 0.5) * WORLD_SIZE / rows;
            const centerHeight = terrainElevation(x, z);
            let water = 0;
            let lowland = 0;
            let peaks = 0;
            let localMin = 999;
            let localMax = -999;
            const radius = 760;
            for (let ring = 1; ring <= 4; ring++) {
              for (let a = 0; a < 12; a++) {
                const angle = a / 12 * TAU;
                const r = radius * ring / 4;
                const h = terrainElevation(x + Math.cos(angle) * r, z + Math.sin(angle) * r);
                const isWater = h < SEA_LEVEL;
                if (isWater) water++;
                if (h > SEA_LEVEL && h < 170) lowland++;
                if (h > 300) peaks++;
                localMin = Math.min(localMin, h);
                localMax = Math.max(localMax, h);
                heightTotal += h;
                waterSamples += isWater ? 1 : 0;
                allSamples++;
              }
            }
            const waterFraction = water / 48;
            const shoreScore = 1 - Math.abs(waterFraction - 0.48) * 2;
            const score = shoreScore + (centerHeight < SEA_LEVEL ? 0.32 : 0) + lowland / 96 + (localMax - localMin) / 900 + peaks * 0.005;
            candidates.push({
              x: Math.round(x),
              z: Math.round(z),
              score: Number(score.toFixed(3)),
              water: Number(waterFraction.toFixed(2)),
              center: Math.round(centerHeight),
              range: Math.round(localMax - localMin)
            });
          }
        }
        candidates.sort((a, b) => b.score - a.score);
        document.body.dataset.survey = JSON.stringify({
          water: Number((waterSamples / allSamples).toFixed(3)),
          averageHeight: Math.round(heightTotal / allSamples),
          candidates: candidates.slice(0, 12)
        });
      }
    }

    async function boot() {
      try {
        landShader = createProgram(terrainVertexSource, terrainFragmentSource);
        planeShader = createProgram(planeVertexSource, planeFragmentSource);
        landVao = createQuad();
        planeGeometry = setupPlaneGeometry();
        resizeCanvases();
        setupInput();
        const terrain = await loadTerrain();
        uploadHeightfield(terrain.data, terrain.size);
        applyDebugParams();
        // Give the terrain a sane altitude before the first frame.
        plane.y = Math.max(plane.y, terrainElevation(plane.x, plane.z) + 145);
        state.started = true;
        loading.classList.add("hidden");
        setTimeout(() => loading.remove(), 650);
        document.body.dataset.state = "ready";
        requestAnimationFrame(frame);
      } catch (error) {
        state.error = String(error && error.stack || error);
        debugState.error = state.error;
        console.error(error);
        document.body.dataset.state = "error";
        $("#unsupported").style.display = "grid";
        $("#unsupported").textContent = "The patrol could not initialize: " + (error.message || error);
        loading.style.display = "none";
      }
    }

    let landVao = null;
    boot();
  })();
  </script>
